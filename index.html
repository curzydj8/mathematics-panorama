<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学全景图 · 从小学到世界级难题</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #faf9f7; --sidebar-bg: #1a1a2e; --text: #2c3e50;
    --accent: #c0392b; --gold: #d4af37; --link: #2980b9;
    --code-bg: #2d2d2d; --border: #e0ddd8;
  }
  html { scroll-behavior: smooth; }
  body { font-family: "Noto Serif SC", "Songti SC", Georgia, serif; background: var(--bg); color: var(--text); line-height: 1.9; }
  #app { display: flex; min-height: 100vh; }

  /* 侧边栏 */
  #sidebar { width: 300px; background: var(--sidebar-bg); color: #ecf0f1; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; transition: transform .3s; }
  #sidebar .brand { padding: 28px 24px 20px; border-bottom: 1px solid #2c2c44; }
  #sidebar .brand h1 { font-size: 22px; color: var(--gold); letter-spacing: 4px; }
  #sidebar .brand p { font-size: 12px; color: #8a8aa3; margin-top: 6px; }
  #toc { padding: 12px 0 40px; }
  .toc-vol { padding: 14px 24px 6px; font-size: 13px; color: var(--gold); font-weight: bold; letter-spacing: 2px; }
  .toc-item { display: block; padding: 7px 24px 7px 36px; color: #b8b8cc; text-decoration: none; font-size: 14px; cursor: pointer; border-left: 3px solid transparent; }
  .toc-item:hover { background: #252542; color: #fff; }
  .toc-item.active { background: #252542; color: var(--gold); border-left-color: var(--gold); }
  .toc-item .status { font-size: 11px; margin-left: 6px; }

  /* 主内容 */
  #main { margin-left: 300px; flex: 1; max-width: 900px; padding: 48px 56px 120px; }
  #content h1 { font-size: 32px; margin: 0 0 8px; color: #1a1a2e; border-bottom: 3px solid var(--gold); padding-bottom: 16px; }
  #content h2 { font-size: 24px; margin: 44px 0 16px; color: var(--accent); }
  #content h3 { font-size: 19px; margin: 32px 0 12px; color: #1a1a2e; }
  #content p { margin: 14px 0; text-align: justify; }
  #content blockquote { border-left: 4px solid var(--gold); background: #fdf6e3; padding: 14px 20px; margin: 20px 0; font-style: italic; color: #5d4e37; }
  #content table { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 15px; }
  #content th, #content td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
  #content th { background: #f0ede8; }
  #content code { background: #f0ede8; padding: 2px 7px; border-radius: 4px; font-size: .92em; font-family: "JetBrains Mono", Consolas, monospace; }
  #content pre { background: var(--code-bg); color: #f8f8f2; padding: 20px 24px; border-radius: 8px; overflow-x: auto; margin: 20px 0; line-height: 1.6; }
  #content pre code { background: none; padding: 0; color: inherit; }
  #content ul, #content ol { margin: 12px 0 12px 28px; }
  #content li { margin: 6px 0; }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 36px 0; }
  #content img { max-width: 100%; }
  .katex-display { overflow-x: auto; padding: 8px 0; }

  /* 封面 */
  .cover { text-align: center; padding: 60px 20px; }
  .cover h1 { font-size: 54px !important; letter-spacing: 12px; border: none !important; color: #1a1a2e !important; }
  .cover .subtitle { font-size: 20px; color: var(--accent); margin: 16px 0 40px; letter-spacing: 6px; }
  .cover .formula-box { display: inline-block; text-align: left; background: #1a1a2e; color: #f8f8f2; padding: 28px 40px; border-radius: 12px; margin: 20px 0; font-size: 17px; line-height: 2.2; }

  /* 移动端 */
  #menu-btn { display: none; position: fixed; top: 16px; left: 16px; z-index: 200; background: var(--sidebar-bg); color: var(--gold); border: 1px solid var(--gold); border-radius: 8px; padding: 10px 14px; font-size: 18px; cursor: pointer; }
  @media (max-width: 768px) {
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; padding: 72px 20px 80px; }
    #menu-btn { display: block; }
  }
  /* 加载动画 */
  #loading { text-align: center; padding: 100px 0; color: #999; }
  .nav-links { display: flex; justify-content: space-between; margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border); }
  .nav-links a { color: var(--link); text-decoration: none; font-size: 15px; cursor: pointer; }
  .nav-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div id="app">
  <nav id="sidebar">
    <div class="brand">
      <h1>数学全景图</h1>
      <p>从小学到世界级难题 · till 著</p>
    </div>
    <div id="toc"></div>
  </nav>
  <main id="main">
    <div id="content"><div id="loading">正在加载数学宇宙…</div></div>
    <div class="nav-links" id="nav-links" style="display:none">
      <a id="prev-link">← 上一章</a>
      <a id="next-link">下一章 →</a>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
<script>
// 目录结构
const BOOK = [
  { vol: "总览", items: [
    { title: "本书导读", file: "README.md" },
  ]},
  { vol: "第一卷 · 小学数学", items: [
    { title: "封面 · 目录 · 前言", file: "vol1-elementary/00-cover-toc-preface.md" },
    { title: "第1章 自然数", file: "vol1-elementary/ch01-natural-numbers.md" },
    { title: "第2章 加减法", file: "vol1-elementary/ch02-add-subtract.md" },
    { title: "第3章 乘除法", file: "vol1-elementary/ch03-multiply-divide.md", soon: true },
    { title: "第4章 分数", file: "vol1-elementary/ch04-fractions.md", soon: true },
    { title: "第5章 小数与百分数", file: "vol1-elementary/ch05-decimals.md", soon: true },
    { title: "第6章 几何入门", file: "vol1-elementary/ch06-geometry.md", soon: true },
    { title: "第7章 找规律", file: "vol1-elementary/ch07-patterns.md", soon: true },
  ]},
  { vol: "第四卷 · 大学基础", items: [
    { title: "第20章 极限与连续", file: "vol4-university/ch20-limits.md" },
    { title: "第21章 微分学", file: "vol4-university/ch21-differentiation.md" },
    { title: "第22章 积分学", file: "vol4-university/ch22-integration.md" },
    { title: "第23章 级数（拉马努金）", file: "vol4-university/ch23-series.md" },
    { title: "第24章 线性代数", file: "vol4-university/ch24-linear-algebra.md" },
    { title: "第25章 概率论", file: "vol4-university/ch25-probability.md" },
  ]},
  { vol: "第二卷 · 初中数学", items: [
    { title: "即将推出", file: null, soon: true },
  ]},
  { vol: "拉马努金卷", items: [
    { title: "即将推出", file: null, soon: true },
  ]},
  { vol: "千禧难题卷", items: [
    { title: "即将推出", file: null, soon: true },
  ]},
];

let flatList = [];
BOOK.forEach(v => v.items.forEach(it => { if (it.file && !it.soon) flatList.push(it); }));
let currentIdx = 0;

function buildTOC() {
  const toc = document.getElementById('toc');
  let html = '';
  BOOK.forEach(v => {
    html += `<div class="toc-vol">${v.vol}</div>`;
    v.items.forEach(it => {
      if (it.soon || !it.file) {
        html += `<span class="toc-item" style="opacity:.4;cursor:default">${it.title}<span class="status">📝</span></span>`;
      } else {
        const idx = flatList.indexOf(it);
        html += `<a class="toc-item" data-idx="${idx}" onclick="loadChapter(${idx})">${it.title}</a>`;
      }
    });
  });
  toc.innerHTML = html;
}

async function loadChapter(idx) {
  currentIdx = idx;
  const it = flatList[idx];
  document.querySelectorAll('.toc-item').forEach(e => e.classList.remove('active'));
  const el = document.querySelector(`[data-idx="${idx}"]`);
  if (el) el.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');

  const content = document.getElementById('content');
  content.innerHTML = '<div id="loading">正在加载…</div>';
  document.getElementById('nav-links').style.display = 'none';

  try {
    const resp = await fetch(it.file);
    if (!resp.ok) throw new Error(' not found');
    let md = await resp.text();
    // marked 渲染
    let html = marked.parse(md);
    content.innerHTML = html;
    // KaTeX 渲染
    renderMathInElement(content, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });
    // 上下章导航
    const nav = document.getElementById('nav-links');
    nav.style.display = 'flex';
    document.getElementById('prev-link').style.visibility = idx > 0 ? 'visible' : 'hidden';
    document.getElementById('next-link').style.visibility = idx < flatList.length - 1 ? 'visible' : 'hidden';
    document.getElementById('prev-link').onclick = () => idx > 0 && loadChapter(idx - 1);
    document.getElementById('next-link').onclick = () => idx < flatList.length - 1 && loadChapter(idx + 1);
    window.scrollTo(0, 0);
    document.title = it.title + ' · 数学全景图';
  } catch (e) {
    content.innerHTML = '<p style="color:#c0392b">加载失败：' + it.file + '</p>';
  }
}

buildTOC();
loadChapter(1); // 默认打开前言
</script>
</body>
</html>
